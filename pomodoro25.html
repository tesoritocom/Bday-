<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Electron App</title>
        <link href='https://fonts.googleapis.com/css?family=Pixelify Sans' rel='stylesheet'>
        <link rel="stylesheet" href="./pomodoro25Css.css">
    </head>
    <body>
        <!--Header Section-->
        <header>
            <div class="container">
                <button id="backBtn" class="backBtn">
                    <img src="./assets/back.png">
                </button>
                <button id="minimizeBtn" class="minimizeBtn">
                    <img src="./assets/_.png">
                </button>
                <button id="closeBtn" class="closeBtn">
                    <img src="./assets/x.png">
                </button>
            </div>

            <div class="choice-today">

                <div class="box">
                    <h1 id="timer">25:00</h1>

                    <img id="icon" src="./assets/Twenty five.png">

                    <div class="button-wrapper">
                        <button id="start" class="button">Start</button>
                        <button id="stop" class="button">Stop</button>
                        <button id="reset" class="button">Reset</button>
                    </div>
                </div>


            </div>

            <div class="text"></div>
            </div>

        

        </header>
        <script src="./pomodoro25Script.js"></script>
    </body>
