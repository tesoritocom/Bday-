<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Electron App</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link href='https://fonts.googleapis.com/css?family=Pixelify Sans' rel='stylesheet'>
        <link rel="stylesheet" href="./styles.css">
    </head>
    <body>
        <!--Header Section-->
        <header>
            <div class="container">
                <h1>Have a good day <3</h1>
                <button id="minimizeBtn" class="minimizeBtn">
                    <img src="./assets/_.png"
                </button>
                <button id="closeBtn" class="closeBtn">
                    <img src="./assets/x.png"
                </button>
            </div>
            
            <div class="start-page">
                <img id="contentImg" src="./assets/Content.png">

                <div class="characters">
                    <img id="Yuuji" src="./assets/Yuuji 1.png">
                    <img id="Grace" src="./assets/Grace 1.png">
                </div>
                
                <button id="startBtn">
                    <img src="./assets/Start.png">
                </button>
            </div>
        </header>
        

        <script src="script.js"></script>
    </body>
</html>
